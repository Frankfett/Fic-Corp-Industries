<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22205A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#FAFAFA"/>

  <text x="600" y="40" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="26" font-weight="bold" fill="#22205A">Social Engineering Target Profiling Framework</text>
  <text x="600" y="64" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#4845A8">OSINT &#8594; Psychological Profiling (MICE / RASCLS) &#8594; Pretext Design &#8594; GoPhish Build &#8594; Defensive Mapping</text>

  <!-- Stage 1 -->
  <rect x="40" y="110" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#22205A" stroke-width="2"/>
  <text x="140" y="138" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="bold" fill="#22205A">1. OSINT Recon</text>
  <text x="140" y="162" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">LinkedIn / org charts</text>
  <text x="140" y="180" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">theHarvester, Shodan</text>
  <text x="140" y="198" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Public records, press</text>
  <text x="140" y="216" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Role &amp; tech stack clues</text>

  <!-- Stage 2 -->
  <rect x="280" y="110" width="220" height="130" rx="10" fill="#FFFFFF" stroke="#4845A8" stroke-width="2"/>
  <text x="390" y="138" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="bold" fill="#4845A8">2. Psychological Profiling</text>
  <text x="390" y="162" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Map findings to MICE levers</text>
  <text x="390" y="180" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Map findings to RASCLS</text>
  <text x="390" y="198" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Rank most likely levers</text>
  <text x="390" y="216" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">for this specific target</text>

  <!-- Stage 3 -->
  <rect x="540" y="110" width="220" height="130" rx="10" fill="#FFFFFF" stroke="#D97B2A" stroke-width="2"/>
  <text x="650" y="138" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="bold" fill="#D97B2A">3. Pretext &amp; Message Design</text>
  <text x="650" y="162" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Select scenario / cover story</text>
  <text x="650" y="180" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Draft subject line &amp; tone</text>
  <text x="650" y="198" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Choose sender identity</text>
  <text x="650" y="216" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Justify lever choice</text>

  <!-- Stage 4 -->
  <rect x="800" y="110" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#1A9968" stroke-width="2"/>
  <text x="900" y="138" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A9968">4. GoPhish Campaign Build</text>
  <text x="900" y="162" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Email template</text>
  <text x="900" y="180" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Landing page</text>
  <text x="900" y="198" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Sending profile</text>
  <text x="900" y="216" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Campaign config (no launch)</text>

  <!-- Stage 5 -->
  <rect x="1040" y="110" width="140" height="130" rx="10" fill="#22205A"/>
  <text x="1110" y="145" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FAFAFA">5. Defensive</text>
  <text x="1110" y="163" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FAFAFA">Mapping</text>
  <text x="1110" y="188" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#FAFAFA">Controls per lever used</text>
  <text x="1110" y="204" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#FAFAFA">Training targeting</text>

  <!-- arrows -->
  <line x1="240" y1="175" x2="278" y2="175" stroke="#22205A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="175" x2="538" y2="175" stroke="#22205A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="175" x2="798" y2="175" stroke="#22205A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="175" x2="1038" y2="175" stroke="#22205A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feedback loop -->
  <path d="M1110,240 C1110,340 140,340 140,242" fill="none" stroke="#D97B2A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="625" y="358" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#D97B2A" font-style="italic">Defensive findings feed back into next profiling cycle</text>

  <!-- MICE box -->
  <rect x="60" y="400" width="500" height="200" rx="10" fill="#FFFFFF" stroke="#4845A8" stroke-width="1.5"/>
  <text x="310" y="428" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="bold" fill="#4845A8">MICE</text>
  <text x="90" y="458" font-family="Calibri, Arial, sans-serif" font-size="13" fill="#333"><tspan font-weight="bold">M</tspan> — Manipulation: fear, urgency, confusion</text>
  <text x="90" y="486" font-family="Calibri, Arial, sans-serif" font-size="13" fill="#333"><tspan font-weight="bold">I</tspan> — Ingratiation: false rapport, likability</text>
  <text x="90" y="514" font-family="Calibri, Arial, sans-serif" font-size="13" fill="#333"><tspan font-weight="bold">C</tspan> — Commitment: consistency pressure</text>
  <text x="90" y="542" font-family="Calibri, Arial, sans-serif" font-size="13" fill="#333"><tspan font-weight="bold">E</tspan> — Ego: authority, pride, status</text>
  <text x="90" y="574" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#666" font-style="italic">Best for: targets with strong org-role signals</text>

  <!-- RASCLS box -->
  <rect x="600" y="400" width="540" height="200" rx="10" fill="#FFFFFF" stroke="#D97B2A" stroke-width="1.5"/>
  <text x="870" y="428" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D97B2A">RASCLS (Cialdini)</text>
  <text x="625" y="455" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#333"><tspan font-weight="bold">R</tspan>eciprocity &#160;&#160;&#160;<tspan font-weight="bold">A</tspan>uthority &#160;&#160;&#160;<tspan font-weight="bold">S</tspan>carcity</text>
  <text x="625" y="480" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#333"><tspan font-weight="bold">C</tspan>ommitment/Consistency &#160;&#160;&#160;<tspan font-weight="bold">L</tspan>iking</text>
  <text x="625" y="505" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#333"><tspan font-weight="bold">S</tspan>ocial Proof</text>
  <text x="625" y="535" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">Use OSINT findings (dept, tenure, recent events,</text>
  <text x="625" y="553" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">public posts) to pick the principle most likely</text>
  <text x="625" y="571" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#333">to land with THIS target, not a generic template.</text>

  <text x="600" y="625" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#999">Authorized, scoped engagements only — config/documentation framework, no live sends.</text>
</svg>
